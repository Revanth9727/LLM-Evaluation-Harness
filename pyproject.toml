[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Pairwise A/B regression gate for doc-grounded LLM assistants"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LLM Eval Harness Maintainers" }
]
license = { text = "MIT" }
keywords = ["llm", "evaluation", "regression", "ab-testing", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
urls = { Homepage = "https://github.com/Revanth9727/LLM-Evaluation-Harness", Repository = "https://github.com/Revanth9727/LLM-Evaluation-Harness" }
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "jinja2>=3.1.2",
    "numpy>=1.23.0",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eval_harness*"]
